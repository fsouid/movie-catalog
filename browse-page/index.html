<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Streaming Platform</title>
    <link rel="stylesheet" href="styles-b.css">
    <script src="https://kit.fontawesome.com/eec9ac1562.js" crossorigin="anonymous"></script>
    
</head>
<body>
    <div id="app">
        <div class="flex flex-col">
            <div class="navbar flex flex-col">
                <div class="flex content-wrapper justify-between align-center">
                    <div class="logo">
                        <i class="fa-solid fa-film"></i>
                        <p class="logo-text">OMDb</p>
                    </div>
                    <div class="links flex align-center">
                        <a href="/" class="link link-main">Movies</a>
                        <a href="/" class="link">TV Shows</a>
                        <a href="/" class="link">Watch</a>
                    </div>
                    <div class="phone-nav">
                        <div class="side-menu hide-anim-out">
                            <i class="fa-solid fa-bars"></i>
                        </div>
                        <div class="close-btn show"></div>
                        <div class="showMenu active">
                            <a href="/" class="link link-main">Movies</a>
                            <a href="/" class="link">TV Shows</a>
                            <a href="/" class="link">Watch</a>
                        </div>
                    </div>
                </div>
                <div class="content-wrapper flex-col align-center">
                    <h1>Browse our trending movies</h1>
                    <div class="input-wrap">
                        <input type="text" id="search-input" placeholder="Search by Title, Year, or Director">
                        <button class="btn search-wrapper flex justify-center align-center" id="search-button">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </button>
                    </div>
                </div>
                <div class="overlay">
                </div>
            </div>
            <section id="search">       <!-- Search section -->

                <div id="filter" class="content-wrapper justify-between">
                    <h2 class="search-info">
                        <span class="success-state">Search results:</span>
                    </h2>
                </div>
                <div id="movie-list">
                    <div class="content-wrapper">
                        <div class="loading-state">
                            <i class="fa-solid fa-hourglass"></i>
                        </div>
                    </div>
                    <div class="movie">
                        <figure class="movie__img--wrapper">
                            <img class="movie__img" src="https://m.media-amazon.com/images/M/MV5BNWE5MGI3MDctMmU5Ni00YzI2LWEzMTQtZGIyZDA5MzQzNDBhXkEyXkFqcGc@._V1_QL75_UX380_CR0,1,380,562_.jpg" alt="movie poster">
                        </figure>
                        <div class="movie__title">Guardians of the Galaxy</div>
                        <p class="movie__year">Year: 2015</p>
                        <div class="movie__details">
                            <button class="btn details-button">Details</button>
                        </div>
                    </div>
                    <div class="movie">
                        <figure class="movie__img--wrapper">
                            <img class="movie__img" src="https://m.media-amazon.com/images/M/MV5BMTM3NTg2NDQzOF5BMl5BanBnXkFtZTcwNjc2NzQzOQ@@._V1_SX300.jpg" alt="movie poster">
                        </figure>
                        <div class="movie__title">Fast & Furious 6</div>
                        <div class="movie__details">
                            <button class="btn details-button" data-id="${movie.imdbID}">Details</button>
                        </div>
                    </div>
                    <div class="movie">
                        <figure class="movie__img--wrapper">
                            <img class="movie__img" src="https://m.media-amazon.com/images/M/MV5BM2Y1YzhkNzUtMzhmZC00OTFkLWJjZDktMWYzZmQ0Y2Y5ODcwXkEyXkFqcGc@._V1_SX300.jpg" alt="movie poster">
                        </figure>
                        <div class="movie__title">Fast & Furious</div>
                        <div class="movie__details">
                            <button class="btn details-button">Details</button>
                        </div>                       
                    </div>
                    <div class="movie">
                        <figure class="movie__img--wrapper">
                            <img class="movie__img" src="https://m.media-amazon.com/images/M/MV5BMjA5NDQyMjc2NF5BMl5BanBnXkFtZTcwMjg5ODcyMw@@._V1_SX300.jpg" alt="movie poster">
                        </figure>
                        <div class="movie__title">How to Train Your Dragon</div>
                        <div class="movie__details">
                            <button class="btn details-button">Details</button>
                        </div>    
                    </div>
                    <div class="movie">
                        <figure class="movie__img--wrapper">
                            <img class="movie__img" src="https://m.media-amazon.com/images/M/MV5BMTU4NDIzMDY1OV5BMl5BanBnXkFtZTcwNjQxMzk3MQ@@._V1_SX300.jpg" alt="movie poster">
                        </figure>
                        <div class="movie__title">The Mummy</div>
                        <div class="movie__details">
                            <button class="btn details-button">Details</button>    
                        </div>                  
                    </div>
                    <div class="movie">
                        <figure class="movie__img--wrapper">
                            <img class="movie__img" src="https://m.media-amazon.com/images/M/MV5BNGE0YTVjNzUtNzJjOS00NGNlLTgxMzctZTY4YTE1Y2Y1ZTU4XkEyXkFqcGc@._V1_QL75_UX380_CR0,0,380,562_.jpg" alt="movie poster">
                        </figure>
                        <div class="movie__title">The Avengers</div>
                        <div class="movie__details">
                            <button class="btn details-button">Details</button>
                        </div>                    
                    </div>
                    <div class="movie">
                        <figure class="movie__img--wrapper">
                            <img class="movie__img" src="https://m.media-amazon.com/images/M/MV5BMTg5NzY0MzA2MV5BMl5BanBnXkFtZTYwNDc3NTc2._V1_SX300.jpg" alt="movie poster">
                        </figure>
                        <div class="movie__title">Cars</div>
                        <div class="movie__details">
                            <button class="btn details-button">Details</button>
                        </div>             
                    </div>
                    <div class="movie">
                        <figure class="movie__img--wrapper">
                            <img class="movie__img" src="https://m.media-amazon.com/images/M/MV5BMjg1ZGRiMTEtYmU4Zi00NTkwLWJmODQtMjU3MTAyMGQ2OGZlXkEyXkFqcGc@._V1_SX300.jpg" alt="movie poster">
                        </figure>
                        <div class="movie__title">Superman Returns</div>
                        <div class="movie__details">
                            <button class="btn details-button">Details</button>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
    <footer>
        <div class="footer__copyright">Copyright &copy 2026 F.Souid</div>
    </footer>
    <script src="script-b.js"></script>
</body>
</html>
