<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>OMDb</title>
        <link rel="stylesheet" href="styles.css">
        <script src="https://kit.fontawesome.com/eec9ac1562.js" crossorigin="anonymous"></script>
        <script src="script.js"></script>
    </head>
    <header class="navbar">
    <div class="phone-nav" id="phoneNav">
        <div class="side-menu" onclick="toggleMenu()">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="close-btn" onclick="toggleMenu()">
            <i class="fa-solid fa-xmark click"></i>
        </div>
        <div class="menu-overlay">
            <a href="browse-page/index.html" class="link link-main">Movies</a>
            <a href="/" class="link">TV Shows</a>
            <a href="/" class="link">Watch</a>
        </div>
    </div>
    <div class="nav content-wrapper justify-between align-center">
        <div class="logo">
            <i class="fa-solid fa-film"></i>
            <p class="logo-text">OMDb</p>
        </div>
        <div class="links justify-between align-center">
            <a href="/browse-page/index.html" class="link link-main">Movies</a>
            <a href="/" class="link">TV Shows</a>
            <a href="/" class="link">Watch</a>
        </div>
    </div> 
    </header>
    <body>
        <div class="landing-page">
            <div class="content-wrapper flex-col justify-between align-center">
                <div class="flex flex-col align-center">
                    <h1>Welcome to America's most awarded movie streaming platform</h1>
                    <h2>Search your favorite movie with OMDb</h2>
                    <div class="input-wrapper">
                        <input type="text" placeholder="Search by Title, Year, or Director">
                        <button id="search-btn" class="not-loading" onclick="startLoading()">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </button>
                        <button id="loading-btn" class="loading is-hidden">
                            <i class="fa-solid fa-hourglass"></i>
                        </button>
                    </div>
                </div>
                <img class="drawing" src="assets/undraw_horror-movie_9020.svg" alt="drawing of girls watching movie">
            </div>
        </div>
    </body>
</html>
